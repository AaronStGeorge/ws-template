[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tools"
version = "0.1.0"
description = "Shared Python libraries for this workspace: buildlib (build types), builds (per-project build functions), and threadlib (launching Codex threads in worktrees)."
requires-python = ">=3.11"
dependencies = ["websockets>=13"]

[project.scripts]
thread = "threadlib.cli:main"

[tool.setuptools]
# Three independent top-level packages installed editable; tests/ is intentionally excluded.
packages = ["buildlib", "builds", "threadlib"]
