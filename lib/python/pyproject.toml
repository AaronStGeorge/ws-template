[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tools"
version = "0.1.0"
description = "Shared Python libraries for this workspace: buildlib (build types), builds (per-project build functions), sourceset (the manifests that fill a checkout's sources/), and workspace_thread (launching workspace threads: Codex threads in worktrees of this workspace)."
requires-python = ">=3.11"
dependencies = ["websockets>=13", "mcp>=1.26,<2"]

[project.scripts]
workspace-thread = "workspace_thread.cli:main"
workspace-thread-mcp = "workspace_thread.mcp:main"

[tool.setuptools]
# Four independent top-level packages installed editable; tests/ is intentionally excluded.
packages = ["buildlib", "builds", "sourceset", "workspace_thread"]
